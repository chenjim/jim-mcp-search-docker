# 开机自启：restart 刻意为 "no" —— dockerd 开机会把带策略的容器一波并行恢复，
# 全机容器统一由宿主 ~/.local/bin/stagger-containers.sh（root crontab @reboot）自动分批拉起
services:
  jim-search:
    build:
      context: .
      network: host
      args:
        - HTTP_PROXY=${HTTP_PROXY:-http://127.0.0.1:7890}
        - HTTPS_PROXY=${HTTPS_PROXY:-http://127.0.0.1:7890}
    image: jim-search:latest
    container_name: jim-search-mcp
    restart: "no"
    network_mode: host
    volumes:
      # cookie.<name>.txt 按域名挂进容器（只读）。域名→文件名映射由
      # JIM_SEARCH_COOKIE_MAP 决定（默认 toutiao/baidu/weibo）。
      - ./cookies:/app/cookies:ro
    environment:
      - JIM_SEARCH_HOST=0.0.0.0
      - JIM_SEARCH_PORT=17492
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      # 百度千帆 AI 搜索（每日免费 100 次）；key 配在 .env 里
      - BAIDU_API_KEY=${BAIDU_API_KEY:-}
      - PARALLEL_SEARCH_MODE=${PARALLEL_SEARCH_MODE:-fast}
      - HTTP_PROXY=${HTTP_PROXY:-http://127.0.0.1:7890}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://127.0.0.1:7890}
      - JIM_SEARCH_PROVIDER_ORDER=${JIM_SEARCH_PROVIDER_ORDER:-random}
      - JIM_SEARCH_TIMEOUT=${JIM_SEARCH_TIMEOUT:-30}
      - JIM_SEARCH_SCRAPE_TIMEOUT=${JIM_SEARCH_SCRAPE_TIMEOUT:-60}
      - JIM_SEARCH_MIN_CONTENT_LENGTH=${JIM_SEARCH_MIN_CONTENT_LENGTH:-200}
      - JIM_SEARCH_SCRAPE_CONCURRENCY=${JIM_SEARCH_SCRAPE_CONCURRENCY:-5}
      - JIM_SEARCH_MAX_CHARS=${JIM_SEARCH_MAX_CHARS:-20000}
      - JIM_SEARCH_AUTH_TOKEN=${JIM_SEARCH_AUTH_TOKEN:-}
      - JIM_SEARCH_ALLOWED_HOSTS=${JIM_SEARCH_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.31.165}
      # 熔断恢复时间按本地午夜计算，需与宿主机时区一致
      - TZ=${TZ:-Asia/Shanghai}
      # Cookie 通道：域名→cookie 文件名映射用代码默认值（toutiao/baidu/weibo），
      # 需要覆盖时在 .env 里设 JIM_SEARCH_COOKIE_MAP='{"example.com":"example"}'
      - JIM_SEARCH_COOKIE_DIR=/app/cookies
      # 这些域名只走 jina：直连注定过不了 JS 挑战（知乎 zse_ck）
      - JIM_SEARCH_JINA_ONLY_DOMAINS=${JIM_SEARCH_JINA_ONLY_DOMAINS:-zhihu.com}
      # 命中 cookie 的域名是否优先直连（省 jina/付费额度）
      - JIM_SEARCH_COOKIE_FIRST=${JIM_SEARCH_COOKIE_FIRST:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:17492/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
